name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Resolve immutable release commit
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  quality:
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  npm-publish:
    needs: [resolve, quality]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - name: Install development dependencies
        run: nix develop -c bun install --frozen-lockfile
      - name: Verify immutable retry identity
        run: |
          set -euo pipefail
          version="$(nix develop -c bun -e 'const manifest = await Bun.file("package.json").json(); process.stdout.write(manifest.version)')"
          test "$RELEASE_TAG" = "agent-hud-v${version}"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" = "$RELEASE_SHA"
      - name: Create release tarball once
        run: nix develop -c bun pm pack --filename "$RUNNER_TEMP/agent-hud.tgz" --ignore-scripts --quiet
      - name: Validate exact release tarball
        run: nix develop -c bun scripts/validate-package.ts "$RUNNER_TEMP/agent-hud.tgz"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish validated tarball
        run: npm publish "$RUNNER_TEMP/agent-hud.tgz" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
